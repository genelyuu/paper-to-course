<!-- nav-dot: _base.html의 NAV_DOTS 자리에 단원마다 한 줄. tooltip = nav_tooltip(없으면 label, 없으면 title), 태그를 뺀 글 -->
<button class="nav-dot" data-target="module-{{id}}" data-tooltip="{{num}} {{tooltip}}" aria-label="{{num}}단원 {{tooltip}}"></button>
<!-- sidebar-item: _base.html의 SIDEBAR_ITEMS 자리에 단원마다 한 줄. label = label(없으면 title), 14자 이내 -->
<a class="sidebar-item" data-module="{{id}}" href="#module-{{id}}"><span class="sidebar-item-num">{{num}}</span><span class="sidebar-item-label">{{label}}</span><span class="sidebar-item-indicator"></span></a>
