<!-- nav-dot: _base.html의 NAV_DOTS 자리에 단원마다 한 줄 -->
<button class="nav-dot" data-target="module-{{id}}" data-tooltip="{{num}} {{label}}" aria-label="{{num}}단원 {{label}}"></button>
<!-- sidebar-item: _base.html의 SIDEBAR_ITEMS 자리에 단원마다 한 줄 -->
<a class="sidebar-item" data-module="{{id}}" href="#module-{{id}}"><span class="sidebar-item-num">{{num}}</span><span class="sidebar-item-label">{{label}}</span><span class="sidebar-item-indicator"></span></a>
