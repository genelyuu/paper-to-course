  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- KaTeX: 수식 렌더링 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });">
  </script>

  <link rel="stylesheet" href="styles.css">

  <!--
    강의별 설정 — 아래 네 개의 강조색 변수만 바꿉니다.
    선택지(교과 색 프리셋: accent / hover / light / muted, 흰 글자 대비):
      과학탐구 파랑  #1F6FB2 / #185A92 / #E8F1FA / #6FA3D3  (기본값, 5.28:1) ML·물리·생명 등 자연과학
      수학 초록      #1B7A50 / #145F3E / #E6F4EC / #6BB592  (5.32:1) 이론·최적화·통계
      사회탐구 보라  #6B4FA8 / #563F88 / #F0ECF8 / #A08ECB  (6.35:1) 경제·사회과학·HCI
      영어 주황      #B85C0F / #964A0B / #FCEFE3 / #E0A06A  (4.59:1) 언어학·언어 중심 NLP
      국어 노랑은 흰 글자 대비가 부족해 뺀다.
  -->
  <style>
    :root {
      --color-accent:       ACCENT_COLOR;
      --color-accent-hover: ACCENT_HOVER;
      --color-accent-light: ACCENT_LIGHT;
      --color-accent-muted: ACCENT_MUTED;
    }
  </style>
