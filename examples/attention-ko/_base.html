      사회탐구 보라  #6B4FA8 / #563F88 / #F0ECF8 / #A08ECB  (6.35:1) 경제·사회과학·HCI

      국어 노랑은 흰 글자 대비가 부족해 뺀다.
  -->
  <style>
    :root {
      --color-accent:       #1F6FB2;
      --color-accent-hover: #185A92;
      --color-accent-light: #E8F1FA;
      --color-accent-muted: #6FA3D3;
